name: UpCloud CSI driver e2e test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  build-image:
    uses: ./.github/workflows/_reusable-build.yaml
    with:
      tags: ${{ github.sha }}
    secrets: inherit

  e2e:
    needs: build-image
    uses: ./.github/workflows/_reusable-e2e.yaml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
