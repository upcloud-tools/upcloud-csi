on:
  workflow_call:
    inputs:
      k8s_version:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: latest
    secrets:
      KUBE_CONFIG:
        required: true
      UPCLOUD_TOKEN:
        required: true
      UPCLOUD_KUBERNETES_CLUSTER_ID:
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  UPCTL_VERSION: "3.36.0"

jobs:
  deploy:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Install upctl
        uses: upcloud-tools/gha-actions/install-upctl@f2881d6a065803a93a5af104f83413f4b6f31ca0 # main
        with:
          upctl-version: ${{ env.UPCTL_VERSION }}
          cache-enabled: "true"

      - name: Scale up node group (k8s ${{ inputs.k8s_version }})
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes node-group scale ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }} --name default --count 2

      - name: Wait for nodes to be Ready
        run: kubectl wait --for=create --for=condition=Ready node --all --timeout=300s

      - name: Deploy CSI driver via Helm (k8s ${{ inputs.k8s_version }})
        env:
          CONTAINER_REPO: ${{ env.REGISTRY }}/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: make deploy-test

  e2e:
    timeout-minutes: 10
    needs: deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-case: [SNAPSHOT, RESIZE_EXT4, RESIZE_XFS, RESIZE_UNATTACHED, LIST, CREATEDELETE, PERSISTENCE, NETPOL, WEBHOOK, WEBHOOK_CM, FILESTORAGE, FS_EXPAND, FS_CONCURRENT]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Run ${{ matrix.test-case }} e2e test (k8s ${{ inputs.k8s_version }})
        run: make test-e2e-ci ${{ matrix.test-case }}=y

  cleanup:
    if: always()
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install upctl
        uses: upcloud-tools/gha-actions/install-upctl@f2881d6a065803a93a5af104f83413f4b6f31ca0 # main
        with:
          upctl-version: ${{ env.UPCTL_VERSION }}
          cache-enabled: "true"

      - name: Scale down node group (k8s ${{ inputs.k8s_version }})
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes node-group scale ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }} --name default --count 0
